<!DOCTYPE html>
<html lang="en">
<script>
  Date.prototype.toLocaleDateString = function() {
    return this.toISOString().split('T')[0];
  };
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>installation coordinator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .edit-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .worker-list, .installation-list {
            margin-top: 20px;
        }

        .worker-item, .installation-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .worker-item:hover, .installation-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .installation-item {
            border-left-color: #764ba2;
            flex-direction: column;
            align-items: flex-start;
        }

        .installation-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .installation-details {
            width: 100%;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .installation-details strong {
            color: #333;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .item-details {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        .item-actions button {
            margin: 0;
            padding: 8px 16px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .filter-section select {
            width: auto;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quality Glazing Contractors </h1>
        <h1>Installation Coordinator</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="workerCount">0</div>
                <div class="stat-label">total workers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="installationCount">0</div>
                <div class="stat-label">scheduled installations</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="upcomingCount">0</div>
                <div class="stat-label">upcoming this week</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>👷 workers</h2>
                <div class="success-msg" id="workerSuccess"></div>
                <form id="workerForm">
                    <div class="form-group">
                        <label for="workerName">worker name</label>
                        <input type="text" id="workerName" required placeholder="john doe">
                    </div>
                    <div class="form-group">
                        <label for="workerPhone">phone</label>
                        <input type="tel" id="workerPhone" required placeholder="787-555-0123">
                    </div>
                    <div class="form-group">
                        <label for="workerRole">role/specialty</label>
                        <input type="text" id="workerRole" placeholder="glass installer, framer, etc.">
                    </div>
                    <button type="submit" id="workerSubmitBtn">add worker</button>
                    <button type="button" id="workerCancelBtn" style="display:none;" onclick="cancelWorkerEdit()">cancel</button>
                </form>

                <div class="worker-list" id="workerList"></div>
            </div>

            <div class="card">
                <h2>📅 installation schedule</h2>
                <div class="success-msg" id="installSuccess"></div>
                <form id="installForm">
                    <div class="form-group">
                        <label for="installDate">installation date</label>
                        <input type="date" id="installDate" required>
                    </div>
                    <div class="form-group">
                        <label for="installTime">time</label>
                        <input type="time" id="installTime" required>
                    </div>
                    <div class="form-group">
                        <label for="clientName">client name</label>
                        <input type="text" id="clientName" required placeholder="jane smith">
                    </div>
                    <div class="form-group">
                        <label for="location">location/address</label>
                        <input type="text" id="location" required placeholder="123 calle principal, san juan">
                    </div>
                    <div class="form-group">
                        <label for="assignedWorkers">assigned workers</label>
                        <select id="assignedWorkers" multiple size="3">
                            <option value="">no workers added yet</option>
                        </select>
                        <small style="color: #666; display: block; margin-top: 5px;">hold ctrl/cmd to select multiple</small>
                    </div>
                    <div class="form-group">
                        <label for="installType">installation type</label>
                        <input type="text" id="installType" placeholder="shower door, window, storefront, etc.">
                    </div>
                    <div class="form-group">
                        <label for="notes">notes/details</label>
                        <textarea id="notes" placeholder="special instructions, materials needed, etc."></textarea>
                    </div>
                    <button type="submit" id="installSubmitBtn">schedule installation</button>
                    <button type="button" id="installCancelBtn" style="display:none;" onclick="cancelInstallEdit()">cancel</button>
                </form>

                <div class="filter-section">
                    <label for="filterDate">filter by date:</label>
                    <select id="filterDate" onchange="filterInstallations()">
                        <option value="all">all installations</option>
                        <option value="upcoming">upcoming only</option>
                        <option value="today">today</option> // ESTO NO FUNCIONA!!!! IDK PQ LOS DATES SE VAN POR 1 DIA
                        <option value="week">this week</option>
                        <option value="month">this month</option>
                    </select>
                </div>

                <div class="installation-list" id="installationList"></div>
            </div>
        </div>
    </div>

    <script>
        let workers = [];
        let installations = [];
        let editingWorkerId = null;
        let editingInstallId = null;

        // load data from memory
        function loadData() {
            const savedWorkers = localStorage.getItem('workers');
            const savedInstallations = localStorage.getItem('installations');
            
            if (savedWorkers) workers = JSON.parse(savedWorkers);
            if (savedInstallations) installations = JSON.parse(savedInstallations);
            
            renderWorkers();
            renderInstallations();
            updateStats();
            updateWorkerSelect();
        }

        // save data to memory
        function saveData() {
            localStorage.setItem('workers', JSON.stringify(workers));
            localStorage.setItem('installations', JSON.stringify(installations));
        }

        // worker form submission
        document.getElementById('workerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('workerName').value;
            const phone = document.getElementById('workerPhone').value;
            const role = document.getElementById('workerRole').value;

            if (editingWorkerId !== null) {
                const worker = workers.find(w => w.id === editingWorkerId);
                worker.name = name;
                worker.phone = phone;
                worker.role = role;
                showSuccess('workerSuccess', 'worker updated!');
                editingWorkerId = null;
                document.getElementById('workerSubmitBtn').textContent = 'add worker';
                document.getElementById('workerCancelBtn').style.display = 'none';
            } else {
                const worker = {
                    id: Date.now(),
                    name: name,
                    phone: phone,
                    role: role
                };
                workers.push(worker);
                showSuccess('workerSuccess', 'worker added!');
            }

            saveData();
            renderWorkers();
            updateStats();
            updateWorkerSelect();
            this.reset();
        });

        // installation form submission
        document.getElementById('installForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const date = document.getElementById('installDate').value;
            const time = document.getElementById('installTime').value;
            const clientName = document.getElementById('clientName').value;
            const location = document.getElementById('location').value;
            const assignedWorkers = Array.from(document.getElementById('assignedWorkers').selectedOptions).map(opt => opt.value);
            const installType = document.getElementById('installType').value;
            const notes = document.getElementById('notes').value;

            if (editingInstallId !== null) {
                const install = installations.find(i => i.id === editingInstallId);
                install.date = date;
                install.time = time;
                install.clientName = clientName;
                install.location = location;
                install.assignedWorkers = assignedWorkers;
                install.installType = installType;
                install.notes = notes;
                showSuccess('installSuccess', 'installation updated!');
                editingInstallId = null;
                document.getElementById('installSubmitBtn').textContent = 'schedule installation';
                document.getElementById('installCancelBtn').style.display = 'none';
            } else {
                const installation = {
                    id: Date.now(),
                    date: date,
                    time: time,
                    clientName: clientName,
                    location: location,
                    assignedWorkers: assignedWorkers,
                    installType: installType,
                    notes: notes
                };
                installations.push(installation);
                showSuccess('installSuccess', 'installation scheduled!');
            }

            saveData();
            renderInstallations();
            updateStats();
            this.reset();
        });

        function renderWorkers() {
            const list = document.getElementById('workerList');
            
            if (workers.length === 0) {
                list.innerHTML = '<div class="empty-state">no workers added yet. add your first worker above!</div>';
                return;
            }

            list.innerHTML = workers.map(worker => `
                <div class="worker-item">
                    <div class="item-info">
                        <div class="item-name">${worker.name}</div>
                        <div class="item-details">
                            📱 ${worker.phone}${worker.role ? ` • ${worker.role}` : ''}
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="edit-btn" onclick="editWorker(${worker.id})">edit</button>
                        <button class="delete-btn" onclick="deleteWorker(${worker.id})">delete</button>
                    </div>
                </div>
            `).join('');
        }

        function renderInstallations() {
            const list = document.getElementById('installationList');
            const filter = document.getElementById('filterDate').value;
            
            let filtered = installations;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (filter !== 'all') {
                filtered = installations.filter(install => {
                    const installDate = new Date(install.date);
                    installDate.setHours(0, 0, 0, 0);

                    if (filter === 'upcoming') {
                        return installDate >= today;
                    } else if (filter === 'today') {
                        return installDate.getTime() === today.getTime();
                    } else if (filter === 'week') {
                        const weekFromNow = new Date(today);
                        weekFromNow.setDate(weekFromNow.getDate() + 7);
                        return installDate >= today && installDate <= weekFromNow;
                    } else if (filter === 'month') {
                        const monthFromNow = new Date(today);
                        monthFromNow.setMonth(monthFromNow.getMonth() + 1);
                        return installDate >= today && installDate <= monthFromNow;
                    }
                    return true;
                });
            }

            // sort by date and time
            filtered.sort((a, b) => {
                const dateA = new Date(`${a.date}T${a.time}`);
                const dateB = new Date(`${b.date}T${b.time}`);
                return dateA - dateB;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">no installations scheduled yet.</div>';
                return;
            }

            list.innerHTML = filtered.map(install => {
                const workerNames = install.assignedWorkers
                    .map(id => workers.find(w => w.id === parseInt(id))?.name || 'unknown')
                    .join(', ') || 'no workers assigned';

                const date = new Date(install.date);
                const formattedDate = date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

                return `
                    <div class="installation-item">
                        <div class="installation-header">
                            <div class="item-info">
                                <div class="item-name">${install.clientName}</div>
                            </div>
                            <div class="item-actions">
                                <button class="edit-btn" onclick="editInstallation(${install.id})">edit</button>
                                <button class="delete-btn" onclick="deleteInstallation(${install.id})">delete</button>
                            </div>
                        </div>
                        <div class="installation-details">
                            <strong>📅 ${formattedDate}</strong> at <strong>🕐 ${install.time}</strong><br>
                            📍 ${install.location}<br>
                            ${install.installType ? `🪟 ${install.installType}<br>` : ''}
                            👷 ${workerNames}<br>
                            ${install.notes ? `📝 ${install.notes}` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editWorker(id) {
            const worker = workers.find(w => w.id === id);
            if (!worker) return;

            document.getElementById('workerName').value = worker.name;
            document.getElementById('workerPhone').value = worker.phone;
            document.getElementById('workerRole').value = worker.role || '';
            
            editingWorkerId = id;
            document.getElementById('workerSubmitBtn').textContent = 'update worker';
            document.getElementById('workerCancelBtn').style.display = 'inline-block';
            
            document.getElementById('workerName').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelWorkerEdit() {
            editingWorkerId = null;
            document.getElementById('workerForm').reset();
            document.getElementById('workerSubmitBtn').textContent = 'add worker';
            document.getElementById('workerCancelBtn').style.display = 'none';
        }

        function deleteWorker(id) {
            if (confirm('are you sure you want to delete this worker?')) {
                workers = workers.filter(w => w.id !== id);
                saveData();
                renderWorkers();
                updateStats();
                updateWorkerSelect();
                showSuccess('workerSuccess', 'worker deleted');
            }
        }

        function editInstallation(id) {
            const install = installations.find(i => i.id === id);
            if (!install) return;

            document.getElementById('installDate').value = install.date;
            document.getElementById('installTime').value = install.time;
            document.getElementById('clientName').value = install.clientName;
            document.getElementById('location').value = install.location;
            document.getElementById('installType').value = install.installType || '';
            document.getElementById('notes').value = install.notes || '';

            const select = document.getElementById('assignedWorkers');
            Array.from(select.options).forEach(option => {
                option.selected = install.assignedWorkers.includes(option.value);
            });

            editingInstallId = id;
            document.getElementById('installSubmitBtn').textContent = 'update installation';
            document.getElementById('installCancelBtn').style.display = 'inline-block';
            
            document.getElementById('installDate').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelInstallEdit() {
            editingInstallId = null;
            document.getElementById('installForm').reset();
            document.getElementById('installSubmitBtn').textContent = 'schedule installation';
            document.getElementById('installCancelBtn').style.display = 'none';
        }

        function deleteInstallation(id) {
            if (confirm('are you sure you want to delete this installation?')) {
                installations = installations.filter(i => i.id !== id);
                saveData();
                renderInstallations();
                updateStats();
                showSuccess('installSuccess', 'installation deleted');
            }
        }

        function updateWorkerSelect() {
            const select = document.getElementById('assignedWorkers');
            
            if (workers.length === 0) {
                select.innerHTML = '<option value="">no workers added yet</option>';
                return;
            }

            select.innerHTML = workers.map(worker => 
                `<option value="${worker.id}">${worker.name}${worker.role ? ` (${worker.role})` : ''}</option>`
            ).join('');
        }

        function updateStats() {
            document.getElementById('workerCount').textContent = workers.length;
            document.getElementById('installationCount').textContent = installations.length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const weekFromNow = new Date(today);
            weekFromNow.setDate(weekFromNow.getDate() + 7);

            const upcoming = installations.filter(install => {
                const installDate = new Date(install.date);
                installDate.setHours(0, 0, 0, 0);
                return installDate >= today && installDate <= weekFromNow;
            }).length;

            document.getElementById('upcomingCount').textContent = upcoming;
        }

        function filterInstallations() {
            renderInstallations();
        }

        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }

        // initialize
        loadData();
    </script>
</body>
</html>
